site_name: Evangeline Philip | Senior Technical Writer
site_description: Portfolio of Evangeline Philip, Senior Technical Writer

theme:
  name: material
  icon:
    logo: material/home-roof
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: white
    accent: green
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.integrate
#    - header.autohide

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
#  - About: about.md
  - Portfolio:
    - Overview: portfolio.md
    - Process Guide: samples/process-guide.md
    - KB Article: samples/kb-article.md
    - Integration Guide: samples/integration-guide.md
    - API Reference: samples/api-reference.md
  - Work With Me: work-with-me.md