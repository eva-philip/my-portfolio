name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Inject API key into widget
        run: |
          sed -i "s|sk-ant-PASTE-YOUR-KEY-HERE|${{ secrets.ANTHROPIC_API_KEY }}|g" docs/ask.html

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force